<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; }
    label { display: block; margin: 10px 0 5px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #4CAF50; color: #fff; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { background: #45a049; }
    #preview img { width: 150px; margin: 10px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Event Registration</h2>
    <form id="registrationForm">
      <label>Full Name</label>
      <input type="text" id="name" required />

      <label>Student ID</label>
      <input type="text" id="studentId" required />

      <label>Email</label>
      <input type="email" id="email" required />

      <label>Phone</label>
      <input type="tel" id="phone" required />

      <label>Department</label>
      <select id="department" required>
        <option value="">Select Department</option>
        <option value="CSE">CSE</option>
        <option value="CSM">CSM</option>
        <option value="CSD">CSD</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">MECH</option>
        <option value="CIVIL">CIVIL</option>
        <option value="CAD">CAD</option>
        <option value="ECE">ECEE</option>
      </select>

      <label>Year</label>
      <select id="year" required>
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>

      <label>Event</label>
      <input type="text" id="event" value="Hackathon" readonly />

      <label>Event Fee (₹)</label>
      <input type="number" id="fee" value="400" readonly />

      <label>UTR Number</label>
      <input type="text" id="utr" required />

      <label>Upload Payment Screenshot</label>
      <input type="file" id="screenshot" accept="image/*" required />

      <div id="preview"></div>
      <button type="submit">Register</button>
    </form>
  </div>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = "https://jkqxisgkngxqlwuojuul.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprcXhpc2drbmd4cWx3dW9qdXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5OTMxODgsImV4cCI6MjA3NDU2OTE4OH0.88ga7OV0KRK44PlAdo3tOZzxARHdSYNBZqp1AIj43vY"; // replace with your anon key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("registrationForm");
    const screenshotInput = document.getElementById("screenshot");
    const previewContainer = document.getElementById("preview");

    // live preview
    screenshotInput.addEventListener("change", () => {
      previewContainer.innerHTML = "";
      const file = screenshotInput.files[0];
      if (file) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        previewContainer.appendChild(img);
      }
    });

    // submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      btn.disabled = true;

      try {
        const file = screenshotInput.files[0];
        let screenshotUrl = null;

        if (file) {
          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage.from("Screenshots")
            .upload(`user_uploads/${Date.now()}_${file.name}`, file);

          if (uploadError) throw uploadError;

          const { data: publicUrl } = supabaseClient
            .storage.from("Screenshots")
            .getPublicUrl(uploadData.path);

          screenshotUrl = publicUrl.publicUrl;
        }

        const formData = {
          name: document.getElementById("name").value,
          student_id: document.getElementById("studentId").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          department: document.getElementById("department").value,
          year: document.getElementById("year").value,
          event: document.getElementById("event").value,
          fee: parseInt(document.getElementById("fee").value),
          utr_number: document.getElementById("utr").value,
          screenshot_url: screenshotUrl,
          status: "pending"
        };

        const { error } = await supabaseClient.from("registrations").insert([formData]);
        if (error) throw error;

        alert("✅ Registration submitted successfully!");
        form.reset();
        previewContainer.innerHTML = "";
      } catch (err) {
        console.error(err);
        alert("❌ Error: " + err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
