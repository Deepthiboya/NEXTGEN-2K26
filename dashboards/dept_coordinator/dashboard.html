<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coordinator Dashboard</title>
  <style>
    :root {
      --primary-color: #ff6e40;
      --secondary-color: #333333;
      --accent-green: #2ecc71;
      --accent-yellow: #f1c40f;
      --background-light: #ecf0f1;
      --card-white: #ffffff;
      --logout-red: #e74c3c;
      --shadow-light: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 40px;
      background: var(--background-light);
      color: var(--secondary-color);
    }

    .dashboard-container {
      max-width: 1300px;
      margin: auto;
      background: var(--card-white);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 25px var(--shadow-light);
      overflow-x: auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 3px solid var(--primary-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    #title {
      color: var(--primary-color);
      font-size: 2em;
      margin: 0;
      flex: 1 1 auto;
      min-width: 200px;
    }

    #logoutBtn {
      padding: 8px 18px;
      background: var(--logout-red);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      flex: 0 0 auto;
      min-width: 100px;
      white-space: nowrap;
    }
    #logoutBtn:hover { background: #c0392b; }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      min-width: 800px;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--primary-color);
      color: white;
      text-transform: uppercase;
      font-size: 0.85em;
    }

    tr:nth-child(even) { background: #f9f9f9; }
    tr:hover { background: #f0f0f0; }

    .status-badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
    }
    .status-paid { background: var(--accent-green); color: white; }
    .status-pending { background: var(--accent-yellow); color: #333; }
    .status-na { background: #bbb; color: white; }

    /* Responsive adjustments */

    @media (max-width: 992px) {
      body {
        padding: 20px 15px;
      }
      .dashboard-container {
        padding: 20px 15px;
        max-width: 100%;
      }
      #title {
        font-size: 1.6em;
      }
      table {
        min-width: 700px;
      }
    }

    @media (max-width: 768px) {
      .header-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      #logoutBtn {
        width: 100%;
        min-width: unset;
      }
      #title {
        width: 100%;
        margin-bottom: 10px;
      }
      table {
        min-width: 600px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }
      .dashboard-container {
        padding: 15px 10px;
        border-radius: 8px;
      }
      table {
        min-width: 500px;
        font-size: 0.85em;
      }
      th, td {
        padding: 8px 10px;
      }
      .status-badge {
        font-size: 0.7em;
        padding: 3px 7px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header-bar">
      <h1 id="title">Coordinator Dashboard</h1>
      <button id="logoutBtn">Logout</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Event</th>
          <th>Fee</th>
          <th>UTR Number</th>
          <th>Status</th>
          <th>Year</th>
          <th>Registered On</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="10" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jkqxisgkngxqlwuojuul.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprcXhpc2drbmd4cWx3dW9qdXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5OTMxODgsImV4cCI6MjA3NDU2OTE4OH0.88ga7OV0KRK44PlAdo3tOZzxARHdSYNBZqp1AIj43vY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const titleEl = document.getElementById('title');
    const tableBody = document.getElementById('table-body');
    const logoutBtn = document.getElementById('logoutBtn');

    // Helper for safe values
    const safe = (val, def='N/A') => (!val || val === '') ? def : val;

    async function loadDashboard() {
      const { data: { user }, error: userErr } = await supabase.auth.getUser();
      if (userErr || !user) {
        window.location.href = "/tarangnxtzen/dashboards/login.html";
        return;
      }

      const { data: profile, error: profErr } = await supabase
        .from('profiles')
        .select('department')
        .eq('id', user.id)
        .single();

      if (profErr || !profile) {
        titleEl.innerText = "Profile Error!";
        return;
      }

      const dept = profile.department;
      titleEl.innerText = `${dept} Coordinator Dashboard`;

      const { data: regs, error } = await supabase
        .from('registrations')
        .select('student_id, name, email, phone, event, fee, utr_number, status, year, created_at')
        .eq('department', dept);

      if (error) {
        console.error(error);
        tableBody.innerHTML = `<tr><td colspan="10" style="color:red; text-align:center;">Error loading data</td></tr>`;
        return;
      }

      if (!regs || regs.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center;">No registrations found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = "";
      regs.forEach(r => {
        let badge;
        const status = safe(r.status).toLowerCase();
        if (status === 'paid' || status === 'completed') badge = `<span class="status-badge status-paid">Paid</span>`;
        else if (status === 'pending' || status === 'unpaid') badge = `<span class="status-badge status-pending">Pending</span>`;
        else badge = `<span class="status-badge status-na">N/A</span>`;

        const row = `
          <tr>
            <td>${safe(r.student_id)}</td>
            <td>${safe(r.name)}</td>
            <td>${safe(r.email)}</td>
            <td>${safe(r.phone)}</td>
            <td>${safe(r.event)}</td>
            <td>${safe(r.fee)}</td>
            <td>${safe(r.utr_number)}</td>
            <td>${badge}</td>
            <td>${safe(r.year)}</td>
            <td>${new Date(r.created_at).toLocaleString()}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = "/tarangnxtzen/dashboards/login.html";
    });

    loadDashboard();
  </script>
</body>
</html>
