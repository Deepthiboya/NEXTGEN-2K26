<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Tarang NextGen</title>

  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.97);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      width: 360px;
      max-width: 92%;
      position: relative;
      z-index: 10;
    }

    h2 {
      color: #ff6600;
      text-align: center;
      margin: 0 0 20px;
    }

    .login-subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 1rem;
    }

    input {
      border: 1px solid #ccc;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #ff6600;
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.12);
    }

    button {
      background: #ff6600;
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #e65c00;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #error-msg {
      color: #d9534f;
      margin-top: 12px;
      min-height: 1.2em;
      text-align: center;
      font-size: 14px;
    }

    #success-msg {
      color: #198754;
      margin-top: 12px;
      min-height: 1.2em;
      text-align: center;
      font-size: 14px;
    }

    /* Background */
    .animated-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        135deg,
        #7a7676 0%,
        #d59849 50%,
        #767572 100%
      );
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }

    .particle-orange {
      background: radial-gradient(
        circle,
        #ff6600 0%,
        #ff8533 50%,
        transparent 70%
      );
      box-shadow:
        0 0 20px #ff6600,
        0 0 40px #ff6600,
        0 0 60px #ff6600;
    }

    .particle-white {
      background: radial-gradient(
        circle,
        #ffffff 0%,
        #f0f0f0 50%,
        transparent 70%
      );
      box-shadow:
        0 0 15px #ffffff,
        0 0 30px #ffffff,
        0 0 45px #ffffff;
    }

    .connection-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #ff6600,
        transparent
      );
      opacity: 0;
      animation: linePulse 3s ease-in-out infinite;
    }

    .geometric-shape {
      position: absolute;
      border: 2px solid #ff6600;
      opacity: 0.3;
      animation: rotate 10s linear infinite;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #ff6600;
      background: none;
    }

    .square {
      width: 20px;
      height: 20px;
      background: transparent;
    }

    .hexagon {
      width: 30px;
      height: 17px;
      background: #ff6600;
      position: relative;
    }

    .hexagon::before,
    .hexagon::after {
      content: "";
      position: absolute;
      width: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
    }

    .hexagon::before {
      bottom: 100%;
      border-bottom: 8px solid #ff6600;
    }

    .hexagon::after {
      top: 100%;
      border-top: 8px solid #ff6600;
    }

    .pentagon {
      width: 54.64px;
      height: 50px;
      background: #ff6600;
      clip-path: polygon(
        50% 0%,
        95% 35%,
        79% 90%,
        21% 90%,
        5% 35%
      );
      opacity: 0.3;
      position: absolute;
      box-sizing: border-box;
      animation: rotate 12s linear infinite;
    }

    .octagon {
      width: 40px;
      height: 40px;
      background: #ff6600;
      clip-path: polygon(
        30% 0%,
        70% 0%,
        100% 30%,
        100% 70%,
        70% 100%,
        30% 100%,
        0% 70%,
        0% 30%
      );
      opacity: 0.3;
      position: absolute;
      box-sizing: border-box;
      animation: rotate 15s linear infinite reverse;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.7;
      }

      25% {
        transform: translateY(-20px) rotate(90deg);
        opacity: 1;
      }

      50% {
        transform: translateY(-40px) rotate(180deg);
        opacity: 0.8;
      }

      75% {
        transform: translateY(-20px) rotate(270deg);
        opacity: 0.9;
      }
    }

    @keyframes linePulse {
      0%, 100% {
        opacity: 0;
        transform: scaleX(0);
      }

      50% {
        opacity: 0.6;
        transform: scaleX(1);
      }
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
        opacity: 0.3;
      }

      50% {
        opacity: 0.6;
      }

      100% {
        transform: rotate(360deg);
        opacity: 0.3;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
    }

    .pulse-animation {
      animation: pulse 4s ease-in-out infinite;
    }

    @media (max-width: 400px) {
      .login-container {
        width: 92%;
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated Background -->
  <div class="animated-background">

    <div
      class="particle particle-orange"
      style="left: 10%; top: 20%; width: 10px; height: 10px;">
    </div>

    <div
      class="particle particle-white"
      style="left: 50%; top: 40%; width: 15px; height: 15px;">
    </div>

    <div
      class="particle particle-orange"
      style="left: 80%; top: 60%; width: 12px; height: 12px;">
    </div>

    <div
      class="particle particle-white"
      style="left: 30%; top: 80%; width: 8px; height: 8px;">
    </div>

    <div
      class="particle particle-orange"
      style="left: 70%; top: 10%; width: 14px; height: 14px;">
    </div>

    <div
      class="connection-line"
      style="left: 20%; top: 30%; width: 100px;">
    </div>

    <div
      class="connection-line"
      style="left: 60%; top: 50%; width: 80px;">
    </div>

    <div
      class="geometric-shape triangle"
      style="left: 40%; top: 70%;">
    </div>

    <div
      class="geometric-shape square"
      style="left: 90%; top: 20%;">
    </div>

    <div
      class="geometric-shape hexagon pulse-animation"
      style="left: 15%; top: 50%;">
    </div>

    <div
      class="geometric-shape pentagon"
      style="left: 25%; top: 30%;">
    </div>

    <div
      class="geometric-shape octagon"
      style="left: 75%; top: 70%;">
    </div>

  </div>

  <!-- Login -->
  <div class="login-container">

    <h2>Login</h2>

    <div class="login-subtitle">
      Tarang NextGen
    </div>

    <form id="login-form">

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />

      <button id="login-btn" type="submit">
        Login
      </button>

    </form>

    <div id="error-msg"></div>
    <div id="success-msg"></div>

  </div>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://jkqxisgkngxqlwuojuul.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprcXhpc2drbmd4cWx3dW9qdXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5OTMxODgsImV4cCI6MjA3NDU2OTE4OH0.88ga7OV0KRK44PlAdo3tOZzxARHdSYNBZqp1AIj43vY";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      errorMsg.textContent = "";
      successMsg.textContent = "";

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        errorMsg.textContent = "Enter both email and password.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {

        /* ==========================================
           STEP 1: SUPABASE AUTHENTICATION
        ========================================== */

        const {
          data: loginData,
          error: loginError
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (loginError || !loginData?.user) {
          console.error("Login error:", loginError);

          errorMsg.textContent =
            "Invalid email or password.";

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        const uid = loginData.user.id;

        /* ==========================================
           STEP 2: FETCH PROFILE
        ========================================== */

        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("role, disabled, email")
          .eq("id", uid)
          .single();

        if (profileError || !profile) {

          console.error("Profile error:", profileError);

          errorMsg.textContent =
            "Profile not found. Contact admin.";

          await supabaseClient.auth.signOut();

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        /* ==========================================
           STEP 3: CHECK DISABLED STATUS
        ========================================== */

        if (profile.disabled === true) {

          errorMsg.textContent =
            "Your account has been disabled.";

          await supabaseClient.auth.signOut();

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        /* ==========================================
           STEP 4: CHECK ROLE
        ========================================== */

        const role = profile.role;

        if (!role) {

          errorMsg.textContent =
            "User role not set. Contact admin.";

          await supabaseClient.auth.signOut();

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        successMsg.textContent = "Login successful. Redirecting...";

        /* ==========================================
           STEP 5: REDIRECT
        ========================================== */

        switch (role) {

  case "super_admin":
    window.location.href =
      "../dashboards/super_admin/dashboard.html";
    break;

  case "convenor":
    window.location.href =
      "../dashboards/convenor/dashboard.html";
    break;

  case "dept_coordinator":
    window.location.href =
      "../dashboards/dept_coordinator/dashboard.html";
    break;

  case "student_coordinator":
    window.location.href =
      "../dashboards/student_coordinator/dashboard.html";
    break;

  default:
    errorMsg.textContent = "Unknown role. Contact admin.";
    await supabaseClient.auth.signOut();
}

      } catch (error) {

        console.error("Unexpected login error:", error);

        errorMsg.textContent =
          "Unexpected error. Please try again.";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
